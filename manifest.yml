modules:
  # Issue paneli: her issue'da sağlık puanını, bandı ve kontrol sonuçlarını gösterir.
  jira:issuePanel:
    - key: issue-health-check-panel
      resource: issue-panel
      resolver:
        function: resolver
      render: native
      title: Issue Health Check
      icon: resource:icons;health-check.svg

  # Proje ayarları sayfası: proje yöneticileri kontrolleri açıp kapatır ve sınırları belirler.
  jira:projectSettingsPage:
    - key: issue-health-check-settings
      resource: settings-page
      resolver:
        function: resolver
      render: native
      title: Health Check Settings

  # Her iki ekranın da çağırdığı backend fonksiyonu (src/index.js içindeki resolver'lar).
  function:
    - key: resolver
      handler: index.handler

resources:
  - key: issue-panel
    path: src/frontend/index.jsx
  - key: settings-page
    path: src/frontend/settings.jsx
  - key: icons
    path: static/icons

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/1090f548-2bd6-4752-9e51-fd176ae7ffc2

permissions:
  scopes:
    # Jira REST API'sini kullanıcı adına okumak için (issue, mypermissions, project).
    - read:jira-work
    # Proje ayarlarını Forge Key-Value Storage'da saklamak için.
    - storage:app
